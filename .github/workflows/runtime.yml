name: Runtime Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q run.py src

      - name: Emergency detector unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Flask/API smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import io
          import numpy as np
          from PIL import Image

          import app
          from unittest.mock import patch

          client = app.app.test_client()

          health = client.get("/api/health")
          assert health.status_code == 200, health.data.decode()
          health_data = health.get_json()
          assert health_data["status"] == "ok"

          state = client.get("/api/state")
          assert state.status_code == 200, state.data.decode()
          state_data = state.get_json()
          assert set(["North", "South", "East", "West"]).issubset(state_data["directions"])

          reset = client.post("/api/camera/reset")
          assert reset.status_code == 200, reset.data.decode()

          invalid = client.post(
              "/api/control",
              json={"emergency": True, "emergency_type": "police", "emergency_direction": "North"},
          )
          assert invalid.status_code == 400, invalid.data.decode()

          # Exercise /api/frame without requiring a real camera or GPU inference.
          original_process = app.vision.process

          def fake_process(frame):
              return {
                  "cars": 1, "bikes": 0, "buses": 0, "trucks": 0,
                  "total_vehicles": 1,
                  "directions": {"North": 1, "South": 0, "East": 0, "West": 0},
                  "pedestrians": 0, "avg_speed": 20.0, "density": "LOW",
                  "queue_length": 1, "avg_waiting_time": 14.0,
                  "emergency": False, "emergency_type": "",
                  "emergency_direction": "", "emergency_confidence": 0.0,
              }, frame

          app.vision.process = fake_process

          image = Image.new("RGB", (320, 180), "white")
          buf = io.BytesIO()
          image.save(buf, format="JPEG")
          payload = base64.b64encode(buf.getvalue()).decode("ascii")

          frame = client.post("/api/frame", json={"image": payload})
          assert frame.status_code == 200, frame.data.decode()
          assert frame.get_json()["traffic"] == 1

          app.vision.process = original_process

          # Regression checks for emergency label normalization.
          assert app.EmergencyDetector._label("firefighting truck") == "fire truck"
          assert app.EmergencyDetector._label("fire engine") == "fire truck"
          assert app.EmergencyDetector._label("ambulance van") == "ambulance"
          assert app.EmergencyDetector._label("police car") not in app.EmergencyDetector.EMERGENCY_LABELS

          # Verify normal direction changes include a yellow clearance phase.
          app.control_mode = "Auto"
          app.current_direction = "North"
          app.signal_phase = "Green"
          app.pending_direction = None
          app.signal_started_at = 1000.0
          app.phase_started_at = 1000.0
          app.signal_duration = 15
          phase_metrics = {
              "cars": 5, "bikes": 0, "buses": 0, "trucks": 0,
              "total_vehicles": 5, "pedestrians": 0, "avg_speed": 10.0,
              "density": "LOW", "queue_length": 2, "avg_waiting_time": 28.0,
              "directions": {"North": 0, "South": 0, "East": 5, "West": 0},
              "emergency": False, "emergency_type": "",
              "emergency_direction": "", "emergency_confidence": 0.0,
          }
          with patch("app.time.time", return_value=1016.0):
              app.update_state(phase_metrics)
          assert app.traffic_data["signal"] == "Yellow", app.traffic_data
          with patch("app.time.time", return_value=1020.0):
              app.update_state(phase_metrics)
          assert app.traffic_data["signal"] == "Green", app.traffic_data
          assert app.traffic_data["active_direction"] == "East", app.traffic_data

          print("Emergency label and yellow-clearance regression checks: PASS")
          print("Runtime smoke test: PASS")
          print("Health:", health_data)
          print("State/API/frame/control checks: PASS")
          PY

      - name: Gunicorn startup check
        run: |
          timeout 15s gunicorn --workers 1 --threads 2 --bind 127.0.0.1:5000 --timeout 30 run:app || test $? -eq 124
