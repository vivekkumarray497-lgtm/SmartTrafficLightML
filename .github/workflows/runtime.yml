name: Runtime Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q run.py src

      - name: Emergency detector unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Flask/API smoke test
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import io
          import numpy as np
          from PIL import Image

          import app
          from unittest.mock import patch

          client = app.app.test_client()
          page = client.get("/")
          assert page.status_code == 200, page.data.decode()
          with client.session_transaction() as session:
              csrf_token = session["csrf_token"]
          csrf_headers = {"X-CSRF-Token": csrf_token}
          control_headers = {
              **csrf_headers,
              "X-Control-Token": app.CONTROL_API_TOKEN,
          }

          # State-changing API requests must reject missing CSRF and control tokens.
          csrf_rejected = client.post("/api/camera/reset")
          assert csrf_rejected.status_code == 403, csrf_rejected.data.decode()
          control_rejected = client.post("/api/camera/reset", headers=csrf_headers)
          assert control_rejected.status_code == 403, control_rejected.data.decode()
          frame_control_rejected = client.post(
              "/api/frame", json={}, headers=csrf_headers
          )
          assert frame_control_rejected.status_code == 403, frame_control_rejected.data.decode()
          validation_control_rejected = client.post(
              "/api/validation/sample", json={}, headers=csrf_headers
          )
          assert validation_control_rejected.status_code == 403, validation_control_rejected.data.decode()

          health = client.get("/api/health")
          assert health.status_code == 200, health.data.decode()
          health_data = health.get_json()
          # The emergency model is lazy-loaded on the first processed frame.
          # A fresh process must report degraded/not_loaded rather than falsely healthy.
          assert health_data["status"] == "degraded", health_data
          assert health_data["emergency_detector_status"] == "not_loaded", health_data
          assert health_data["control_auth_required"] is True, health_data

          state = client.get("/api/state")
          assert state.status_code == 200, state.data.decode()
          state_data = state.get_json()
          assert set(["North", "South", "East", "West"]).issubset(state_data["directions"])

          reset = client.post("/api/camera/reset", headers=control_headers)
          assert reset.status_code == 200, reset.data.decode()
          reset_state = reset.get_json()
          assert reset_state["signal"] == "All Red", reset_state
          assert reset_state["emergency_priority_active"] is False, reset_state

          invalid = client.post(
              "/api/control",
              json={"emergency": True, "emergency_type": "police", "emergency_direction": "North"},
              headers=control_headers,
          )
          assert invalid.status_code == 400, invalid.data.decode()

          # Exercise /api/frame without requiring a real camera or GPU inference.
          original_process = app.vision.process

          def fake_process(frame):
              return {
                  "cars": 1, "bikes": 0, "buses": 0, "trucks": 0,
                  "total_vehicles": 1,
                  "directions": {"North": 1, "South": 0, "East": 0, "West": 0},
                  "pedestrians": 0, "avg_speed": 20.0, "density": "LOW",
                  "queue_length": 1, "avg_waiting_time": 14.0,
                  "emergency": False, "emergency_type": "",
                  "emergency_direction": "", "emergency_confidence": 0.0,
              }, frame

          app.vision.process = fake_process

          image = Image.new("RGB", (320, 180), "white")
          buf = io.BytesIO()
          image.save(buf, format="JPEG")
          payload = base64.b64encode(buf.getvalue()).decode("ascii")

          frame = client.post("/api/frame", json={"image": payload}, headers=control_headers)
          assert frame.status_code == 200, frame.data.decode()
          assert frame.get_json()["traffic"] == 1

          app.vision.process = original_process

          # Regression checks for emergency label normalization.
          assert app.EmergencyDetector._label("firefighting truck") == "fire truck"
          assert app.EmergencyDetector._label("fire engine") == "fire truck"
          assert app.EmergencyDetector._label("ambulance van") == "ambulance"
          assert app.EmergencyDetector._label("police car") not in app.EmergencyDetector.EMERGENCY_LABELS

          # Verify normal changes use Yellow -> All Red -> Green clearance.
          app.control_mode = "Auto"
          app.current_direction = "North"
          app.signal_phase = "Green"
          app.pending_direction = None
          app.pending_is_emergency = False
          app.signal_started_at = 1000.0
          app.phase_started_at = 1000.0
          app.signal_duration = 15
          phase_metrics = {
              "cars": 5, "bikes": 0, "buses": 0, "trucks": 0,
              "total_vehicles": 5, "pedestrians": 0, "avg_speed": 10.0,
              "density": "LOW", "queue_length": 2, "avg_waiting_time": 28.0,
              "directions": {"North": 0, "South": 0, "East": 5, "West": 0},
              "emergency": False, "emergency_type": "",
              "emergency_direction": "", "emergency_confidence": 0.0,
          }
          with patch("app.time.time", return_value=1016.0):
              app.update_state(phase_metrics)
          assert app.traffic_data["signal"] == "Yellow", app.traffic_data
          with patch("app.time.time", return_value=1019.0):
              app.update_state(phase_metrics)
          assert app.traffic_data["signal"] == "All Red", app.traffic_data
          with patch("app.time.time", return_value=1020.0):
              app.update_state(phase_metrics)
          assert app.traffic_data["signal"] == "Green", app.traffic_data
          assert app.traffic_data["active_direction"] == "East", app.traffic_data

          # Emergency preemption must not jump directly to GREEN.
          app.current_direction = "North"
          app.signal_phase = "Green"
          app.pending_direction = None
          app.pending_is_emergency = False
          app.signal_started_at = 2000.0
          app.phase_started_at = 2000.0
          app.signal_duration = 15
          emergency_metrics = dict(
              phase_metrics,
              emergency=True,
              emergency_type="ambulance",
              emergency_direction="East",
          )
          with patch("app.time.time", return_value=2000.0):
              app.update_state(emergency_metrics)
          assert app.traffic_data["signal"] == "Yellow", app.traffic_data
          assert app.traffic_data["emergency_priority_active"] is False, app.traffic_data
          with patch("app.time.time", return_value=2003.0):
              app.update_state(emergency_metrics)
          assert app.traffic_data["signal"] == "All Red", app.traffic_data
          assert app.traffic_data["emergency_priority_active"] is False, app.traffic_data
          with patch("app.time.time", return_value=2004.0):
              app.update_state(emergency_metrics)
          assert app.traffic_data["signal"] == "Green", app.traffic_data
          assert app.traffic_data["active_direction"] == "East", app.traffic_data
          assert app.traffic_data["emergency_priority_active"] is True, app.traffic_data

          print("Emergency label, pedestrian, vehicle mapping and signal-clearance regression checks: PASS")
          print("Runtime smoke test: PASS")
          print("Health:", health_data)
          print("State/API/frame/control checks: PASS")
          PY

      - name: Gunicorn startup check
        run: |
          timeout 15s gunicorn --workers 1 --threads 2 --bind 127.0.0.1:5000 --timeout 30 run:app || test $? -eq 124
