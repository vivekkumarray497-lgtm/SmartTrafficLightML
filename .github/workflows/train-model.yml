name: Train and evaluate traffic models

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/train_model.py"
      - "src/train_policy_model.py"
      - "dataset/cleaned_traffic_data.csv"
      - ".github/workflows/train-model.yml"

permissions:
  contents: write

concurrency:
  group: traffic-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn==1.8.0 joblib

      - name: Evaluate legacy signal-label model
        run: python src/train_model.py

      - name: Train traffic-priority policy model
        run: python src/train_policy_model.py

      - name: Save evaluation report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-model-evaluation
          path: |
            reports/model_evaluation.json
            reports/traffic_policy_evaluation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit improved model and evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/random_forest_model.pkl reports/model_evaluation.json model/traffic_priority_model.pkl reports/traffic_policy_evaluation.json dataset/traffic_priority_training_data.csv
          if git diff --cached --quiet; then
            echo "No model or report changes to commit."
          else
            git commit -m "Retrain traffic signal prediction model"
            git push origin HEAD:main
          fi
