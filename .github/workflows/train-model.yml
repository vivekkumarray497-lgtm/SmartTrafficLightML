name: Train and evaluate traffic models

on:
  workflow_dispatch:

concurrency:
  group: traffic-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn==1.8.0 joblib

      - name: Evaluate legacy signal-label model
        run: python src/train_model.py

      - name: Train traffic-priority policy model
        run: python src/train_policy_model.py

      - name: Save evaluation report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-model-evaluation
          path: |
            reports/model_evaluation.json
            reports/traffic_policy_evaluation.json
            model/random_forest_model.pkl
            model/traffic_priority_model.pkl
            dataset/traffic_priority_training_data.csv
          if-no-files-found: warn
          retention-days: 30
