name: Evaluate and improve traffic model

on:
  push:
    paths:
      - "src/train_model.py"
      - "dataset/cleaned_traffic_data.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install model-training dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn==1.8.0 joblib

      - name: Compare candidate models and evaluate
        run: python src/train_model.py

      - name: Commit improved model and evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/random_forest_model.pkl reports/model_evaluation.json
          if git diff --cached --quiet; then
            echo "No model/report changes to commit."
          else
            git commit -m "Evaluate traffic model and promote only verified improvement"
            git push
          fi
